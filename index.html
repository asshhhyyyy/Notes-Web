<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Notes</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
body, html { height:100%; }

body {
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  background: linear-gradient(135deg, #1e3a8a, #2563eb, #3b82f6);
  background-size: 200% 200%;
  animation: gradientMove 15s ease infinite;
  color:#fff;
  transition:0.3s;
  padding:40px 0;
}

@keyframes gradientMove {
  0% { background-position:0% 50%; }
  50% { background-position:100% 50%; }
  100% { background-position:0% 50%; }
}

.container {
  width: 90%;
  max-width: 800px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  animation: fadeUp 1s ease;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(40px);}
  to { opacity:1; transform:translateY(0);}
}

h1 { text-align:center; font-size:2rem; margin-bottom:20px; }
p { margin-bottom:20px; opacity:0.85; }

/* PASSWORD SCREEN */
.password-screen {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.password-screen input {
  padding:12px 15px;
  border:none;
  border-radius:12px;
  outline:none;
  width:250px;
  text-align:center;
  margin-bottom:15px;
  font-size:1rem;
}

.password-screen button {
  padding:10px 20px;
  border:none;
  border-radius:12px;
  background:#3b82f6;
  color:#fff;
  cursor:pointer;
  transition:0.3s;
}

.password-screen button:hover { background:#2563eb; transform:scale(1.05); }

.error-msg { color:#f87171; margin-top:10px; opacity:0.9; }

/* NOTES AREA */
.notes-area { display:none; flex-direction:column; gap:20px; }
.add-note { display:flex; flex-direction:column; gap:15px; margin-bottom:30px; }
.add-note textarea { width:100%; border:none; border-radius:12px; padding:12px; resize:none; outline:none; min-height:50px; background:rgba(255,255,255,0.08); color:#fff; }
.add-note input { width:100%; border:none; border-radius:10px; padding:8px; outline:none; background:rgba(255,255,255,0.05); color:#fff; }
.add-note button { width:150px; align-self:flex-end; padding:10px 15px; border:none; border-radius:10px; background:#2563eb; color:#fff; cursor:pointer; transition:0.3s; }
.add-note button:hover { background:#1d4ed8; }

.note {
  background: rgba(255,255,255,0.08);
  border-radius:15px;
  padding:20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.25);
}

.note p { margin-bottom:10px; }
.note img { width:100%; border-radius:12px; margin-top:8px; }
.note iframe { width:100%; height:80px; border-radius:12px; margin-top:8px; border:none; }

@media(max-width:600px) {
  .add-note textarea { font-size:0.9rem; }
  h1 { font-size:1.7rem; }
}
</style>
</head>
<body>

<div class="container">

  <!-- PASSWORD SCREEN -->
  <div class="password-screen" id="passwordScreen">
    <h1>Enter Admin Password</h1>
    <input type="password" id="passwordInput" placeholder="Password">
    <button onclick="checkPassword()">Enter</button>
    <button onclick="continueAsGuest()">Continue as Guest</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- NOTES AREA -->
  <div class="notes-area" id="notesArea">
    <h1>Secret Notes</h1>
    <p>Write your unsaid letters or messages below. Guests can only view.</p>

    <!-- ADD NOTE ONLY FOR ADMIN -->
    <div class="add-note" id="addNote">
      <textarea placeholder="Write a note..."></textarea>
      <input type="text" placeholder="Optional GIF/Image URL or Spotify Embed URL">
      <button onclick="saveNote(this)">Save Note</button>
    </div>

    <div class="notes-display" id="notesDisplay"></div>
  </div>

</div>

<script>
const PASSWORD = "Saina";

function checkPassword() {
  const input = document.getElementById('passwordInput').value;
  const errorMsg = document.getElementById('errorMsg');
  if(input === PASSWORD) {
    document.getElementById('passwordScreen').style.display = 'none';
    document.getElementById('notesArea').style.display = 'flex';
    document.getElementById('addNote').style.display = 'flex';
  } else {
    errorMsg.innerText = "Incorrect password!";
  }
}

function continueAsGuest() {
  document.getElementById('passwordScreen').style.display = 'none';
  document.getElementById('notesArea').style.display = 'flex';
  document.getElementById('addNote').style.display = 'none';
}

function saveNote(button) {
  const noteDiv = button.parentElement;
  const text = noteDiv.querySelector('textarea').value.trim();
  const optional = noteDiv.querySelector('input').value.trim();
  if(text === "" && optional === "") return;

  const display = document.getElementById('notesDisplay');
  const newNote = document.createElement('div');
  newNote.className = "note";
  let content = `<p>${text.replace(/\n/g,"<br>")}</p>`;

  if(optional !== "") {
    if(optional.includes("spotify") || optional.includes("open.spotify")) {
      content += `<iframe src="${optional}" allow="encrypted-media"></iframe>`;
    } else if(optional.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
      content += `<img src="${optional}">`;
    } else {
      content += `<p style="opacity:0.8;">${optional}</p>`;
    }
  }

  newNote.innerHTML = content;
  display.prepend(newNote);

  // clear inputs
  noteDiv.querySelector('textarea').value = "";
  noteDiv.querySelector('input').value = "";
}

// Enter key triggers password
document.getElementById('passwordInput').addEventListener("keypress", function(e){
  if(e.key === "Enter") checkPassword();
});
</script>

</body>
</html>
