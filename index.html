<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }

html, body {
  height: 100%;
  width: 100%;
}

body {
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg, #1e3a8a, #2563eb, #3b82f6);
  background-size: 200% 200%;
  animation: gradientMove 15s ease infinite;
  color:#fff;
  overflow:hidden;
}

@keyframes gradientMove {
  0% { background-position:0% 50%; }
  50% { background-position:100% 50%; }
  100% { background-position:0% 50%; }
}

.container {
  width: 90%;
  max-width: 450px;
  height: 90vh;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(25px);
  border-radius: 25px;
  padding: 30px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 { font-size:2rem; margin-bottom:20px; text-align:center; }

.password-screen, .notes-area {
  width: 100%;
  flex: 1;
  display:flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.password-screen input {
  padding:12px 15px;
  border:none;
  border-radius:15px;
  outline:none;
  width:100%;
  text-align:center;
  margin-bottom:15px;
  font-size:1rem;
  background: rgba(0,0,0,0.3);
  color: #fff;
  backdrop-filter: blur(10px);
  transition:0.3s;
}

.password-screen input::placeholder { color: #ddd; }
.password-screen input:focus { background: rgba(0,0,0,0.5); }

.password-screen button {
  padding:10px 20px;
  border:none;
  border-radius:15px;
  background:#3b82f6;
  color:#fff;
  cursor:pointer;
  transition:0.3s;
  margin-bottom:10px;
  width:100%;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

.password-screen button:hover { background:#2563eb; transform:scale(1.05); }
.error-msg { color:#fff; margin-top:10px; opacity:0.9; text-align:center; }

.notes-area { display:none; gap:20px; overflow-y:auto; padding-bottom:10px; }

.add-note { display:flex; flex-direction:column; gap:10px; width:100%; margin-bottom:20px; }
.add-note textarea, .add-note input {
  width:100%;
  border:none;
  border-radius:15px;
  padding:12px;
  resize:none;
  outline:none;
  background: rgba(0,0,0,0.4);
  color:#fff;
  backdrop-filter: blur(10px);
  transition:0.3s;
}

.add-note textarea::placeholder, .add-note input::placeholder { color: #ddd; }
.add-note textarea:hover, .add-note input:hover { background: rgba(0,0,0,0.6); }

.add-note button {
  align-self:flex-end;
  padding:10px 15px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  cursor:pointer;
  transition:0.3s;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

.add-note button:hover { background:#1d4ed8; transform:scale(1.05); }

.notes-display {
  width:100%;
  display:flex;
  flex-direction: column;
  gap:15px;
  overflow-y:auto;
}

.note {
  background: rgba(0,0,0,0.35);
  border-radius:20px;
  padding:15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.25);
  position:relative;
  transition: transform 0.3s, background 0.3s;
  color:#fff;
  word-break: break-word;
}

.note:hover { transform: translateY(-5px) scale(1.02); background: rgba(0,0,0,0.5); }

.note img { width:100%; border-radius:15px; margin-top:10px; }
.note iframe { width:100%; height:80px; border-radius:15px; margin-top:10px; border:none; }

.delete-btn {
  position:absolute;
  top:10px;
  right:10px;
  background:#ef4444;
  border:none;
  padding:5px 10px;
  border-radius:10px;
  cursor:pointer;
  color:#fff;
  font-weight:bold;
  transition:0.3s;
}
.delete-btn:hover { background:#b91c1c; transform:scale(1.05); }

@media(max-width:500px){
  .container { padding:20px; }
  h1 { font-size:1.7rem; }
  .add-note textarea { min-height:40px; }
}
</style>
</head>
<body>

<div class="container">
  <h1>Notes</h1>

  <div class="password-screen" id="passwordScreen">
    <input type="password" id="passwordInput" placeholder="Enter Password">
    <button onclick="checkPassword()">Enter</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="notes-area" id="notesArea">
    <div class="add-note" id="addNote">
      <textarea placeholder="Write a note..."></textarea>
      <input type="text" placeholder="Optional GIF/Image URL or Spotify Embed URL">
      <button onclick="saveNote()">Save Note</button>
    </div>
    <div class="notes-display" id="notesDisplay"></div>
  </div>
</div>

<script>
const ADMIN_PASSWORD = "Saina19";
const GUEST_PASSWORD = "Guest123";
let isAdmin = false;

let notes = JSON.parse(localStorage.getItem('myNotes') || "[]");

function checkPassword() {
  const input = document.getElementById('passwordInput').value;
  const errorMsg = document.getElementById('errorMsg');
  if(input === ADMIN_PASSWORD) {
    isAdmin = true;
    showNotesArea();
  } else if(input === GUEST_PASSWORD) {
    isAdmin = false;
    showNotesArea();
  } else {
    errorMsg.innerText = "Incorrect password!";
  }
}

function showNotesArea() {
  document.getElementById('passwordScreen').style.display = 'none';
  document.getElementById('notesArea').style.display = 'flex';
  document.getElementById('addNote').style.display = isAdmin ? 'flex' : 'none';
  renderNotes();
}

function saveNote() {
  if(!isAdmin) return;
  const noteDiv = document.getElementById('addNote');
  const text = noteDiv.querySelector('textarea').value.trim();
  const optional = noteDiv.querySelector('input').value.trim();
  if(text === "" && optional === "") return;
  const newNote = { text, optional };
  notes.unshift(newNote);
  localStorage.setItem('myNotes', JSON.stringify(notes));
  noteDiv.querySelector('textarea').value = "";
  noteDiv.querySelector('input').value = "";
  renderNotes();
}

function deleteNote(index) {
  if(!isAdmin) return;
  notes.splice(index,1);
  localStorage.setItem('myNotes', JSON.stringify(notes));
  renderNotes();
}

function renderNotes() {
  const display = document.getElementById('notesDisplay');
  display.innerHTML = '';
  notes.forEach((note, idx) => {
    const div = document.createElement('div');
    div.className = 'note';
    let content = `<p>${note.text.replace(/\n/g,'<br>')}</p>`;
    if(note.optional){
      if(note.optional.includes("spotify") || note.optional.includes("open.spotify")) {
        let src = note.optional.includes("/embed/") ? note.optional : note.optional.replace("track/","embed/track/");
        content += `<iframe src="${src}" allow="encrypted-media"></iframe>`;
      } else if(note.optional.match(/\.(jpeg|jpg|gif|png|webp)$/i)){
        content += `<img src="${note.optional}">`;
      } else {
        content += `<p style="opacity:0.85;">${note.optional}</p>`;
      }
    }
    if(isAdmin) content += `<button class="delete-btn" onclick="deleteNote(${idx})">Delete</button>`;
    div.innerHTML = content;
    display.appendChild(div);
  });
}

document.getElementById('passwordInput').addEventListener("keypress", function(e){
  if(e.key === "Enter") checkPassword();
});
</script>

</body>
</html>
